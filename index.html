<style>
  :root {

    --text: #1c2430;

    --border: #e2e6ec;
    --primary: #2d6cdf;
    --primary-dark: #1f52ac;
    --primary-soft: #eaf1fd;
    --danger: #d64545;
    --success: #1f9d55;
    --success-soft: #e8f8ee;
    --radius: 14px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 20px; }
  .header .badge {
    display: inline-block;
    background: var(--primary-soft);
    color: var(--primary-dark);
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .header h1 { font-size: 22px; margin: 0 0 6px; font-weight: 700; }
  .header p { margin: 0; color: var(--text-muted); font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);

    padding: 22px;
    margin-bottom: 16px;

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  label.field-label {

    font-size: 14px;
    margin-bottom: 8px;

  .hint { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; }
  select, input[type=text], input[type=url] {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  select:focus, input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-soft);
  }
  .room-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .room-btn {
    padding: 10px 6px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    transition: all .15s;
  }
  .room-btn:hover { border-color: var(--primary); color: var(--primary-dark); }
  .room-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;

  .member-search {

  }
  .member-list {

    overflow-y: auto;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    background: #fafbfc;
  }
  .member-list.disabled {

    align-items: center;
    justify-content: center;

    font-size: 13.5px;

    gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;

  .member-item .name { font-size: 14.5px; }

  .selected-summary {
    margin-top: 10px;
    font-size: 13px;
    color: var(--primary-dark);
    font-weight: 600;
    min-height: 18px;
  }

    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 11px 13px;
    border: 1px solid var(--border);
    border-radius: 10px;
    resize: vertical;
    min-height: 70px;
    outline: none;
  }
  textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .submit-btn {
    width: 100%;

    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
  }

  .submit-btn:disabled { background: #a9bcd8; cursor: not-allowed; }

    padding: 13px 15px;
    font-size: 14px;
    margin-bottom: 16px;
    font-weight: 500;

  .footer-note {

    font-size: 12px;
    color: var(--text-muted);
    margin-top: 20px;
  }

</head>

<div class="wrap">
  <div class="header">
    <span class="badge">งานกลุ่ม · ส่งลิงก์วิดีโอ</span>
    <h1>แบบฟอร์มส่งงานวิดีโอ</h1>
    <p>ม.6/2, 6/3, 6/4, 6/5 &mdash; เลือกห้อง เลือกสมาชิกในกลุ่ม แล้วส่งลิงก์วิดีโอ</p>
  </div>

  <div id="setupWarning" class="msg warn"></div>
  <div id="resultMsg" class="msg"></div>

  <form id="submitForm">
    <div class="card">
      <div class="field">
        <label class="field-label">ห้อง<span class="req">*</span></label>
        <div class="room-grid" id="roomGrid"></div>
      </div>

      <div class="field">
        <label class="field-label">สมาชิกในกลุ่ม (เลือกได้หลายคน)<span class="req">*</span></label>
        <input type="text" id="memberSearch" class="member-search" placeholder="พิมพ์ค้นหาชื่อ..." disabled>
        <div class="member-list disabled" id="memberList">กรุณาเลือกห้องก่อน</div>
        <div class="selected-summary" id="selectedSummary"></div>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label class="field-label" for="title">ชื่อเรื่อง / หัวข้องานที่ทำ<span class="req">*</span></label>
        <input type="text" id="title" placeholder="เช่น การประยุกต์ใช้ตรีโกณมิติในชีวิตประจำวัน">
      </div>
      <div class="field">
        <label class="field-label" for="link">ลิงก์วิดีโอ<span class="req">*</span></label>
        <input type="url" id="link" placeholder="https://...">
        <div class="hint">วางลิงก์ YouTube, Google Drive หรืออื่น ๆ ที่เปิดดูได้</div>
      </div>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">ส่งงาน</button>
  </form>

  <div class="footer-note">โรงเรียนโซ่พิสัยพิทยาคม</div>
</div>

const roomGrid = document.getElementById('roomGrid');
const memberSearch = document.getElementById('memberSearch');
const memberList = document.getElementById('memberList');
const selectedSummary = document.getElementById('selectedSummary');
const setupWarning = document.getElementById('setupWarning');
const resultMsg = document.getElementById('resultMsg');
const submitBtn = document.getElementById('submitBtn');

let currentRoom = null;
let selectedIds = new Set();

if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
  setupWarning.textContent = 'ยังไม่ได้ตั้งค่าปลายทางบันทึกข้อมูล (SCRIPT_URL) — ฟอร์มนี้จะยังส่งไม่ได้จนกว่าจะใส่ลิงก์ Apps Script ในไฟล์';
  setupWarning.classList.add('show');
}

Object.keys(STUDENTS).forEach(room => {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'room-btn';
  btn.textContent = 'ม.' + room;
  btn.addEventListener('click', () => selectRoom(room, btn));
  roomGrid.appendChild(btn);
});

function selectRoom(room, btnEl) {
  currentRoom = room;
  selectedIds = new Set();
  document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
  btnEl.classList.add('active');
  memberSearch.disabled = false;
  memberSearch.value = '';
  renderMembers();
  updateSummary();
}

function renderMembers(filter) {
  memberList.classList.remove('disabled');
  memberList.innerHTML = '';
  const list = STUDENTS[currentRoom] || [];
  const f = (filter || '').trim().toLowerCase();
  list.forEach(s => {
    const match = !f || s.name.toLowerCase().includes(f);
    const item = document.createElement('label');
    item.className = 'member-item' + (match ? '' : ' hidden');
    item.innerHTML =
      '<input type="checkbox" data-id="' + s.id + '" data-name="' + s.name.replace(/"/g,'&quot;') + '">' +
      '<span class="no">' + s.no + '.</span>' +
      '<span class="name">' + s.name + '</span>';
    const checkbox = item.querySelector('input');
    checkbox.checked = selectedIds.has(s.id);
    checkbox.addEventListener('change', () => {
      if (checkbox.checked) selectedIds.add(s.id);
      else selectedIds.delete(s.id);
      updateSummary();
    });
    memberList.appendChild(item);
  });
}

memberSearch.addEventListener('input', () => renderMembers(memberSearch.value));

function updateSummary() {
  if (selectedIds.size === 0) {
    selectedSummary.textContent = '';
    return;
  }
  const list = STUDENTS[currentRoom] || [];
  const names = list.filter(s => selectedIds.has(s.id)).map(s => s.name);
  selectedSummary.textContent = 'เลือกแล้ว ' + names.length + ' คน: ' + names.join(', ');
}

document.getElementById('submitForm').addEventListener('submit', function (e) {
  e.preventDefault();
  resultMsg.classList.remove('show', 'success', 'error');

  const title = document.getElementById('title').value.trim();
  const link = document.getElementById('link').value.trim();
  const list = STUDENTS[currentRoom] || [];
  const memberNames = list.filter(s => selectedIds.has(s.id)).map(s => s.name);

  if (!currentRoom) return showResult('กรุณาเลือกห้อง', 'error');
  if (memberNames.length === 0) return showResult('กรุณาเลือกสมาชิกในกลุ่มอย่างน้อย 1 คน', 'error');
  if (!title) return showResult('กรุณากรอกชื่อเรื่อง', 'error');
  if (!link) return showResult('กรุณากรอกลิงก์วิดีโอ', 'error');
  if (!/^https?:\/\//i.test(link)) return showResult('ลิงก์วิดีโอต้องขึ้นต้นด้วย http:// หรือ https://', 'error');
  if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return showResult('ฟอร์มยังไม่ได้เชื่อมต่อปลายทางบันทึกข้อมูล กรุณาแจ้งผู้ดูแล', 'error');

  submitBtn.disabled = true;
  submitBtn.textContent = 'กำลังส่ง...';

  const payload = new URLSearchParams({
    room: 'ม.' + currentRoom,
    members: memberNames.join(', '),
    title: title,
    link: link
  });

  fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: payload })
    .then(() => {
      showResult('ส่งงานเรียบร้อยแล้ว ขอบคุณครับ/ค่ะ', 'success');
      document.getElementById('submitForm').reset();
      selectedIds = new Set();
      currentRoom = null;
      document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
      memberSearch.disabled = true;
      memberList.className = 'member-list disabled';
      memberList.textContent = 'กรุณาเลือกห้องก่อน';
      selectedSummary.textContent = '';
    })
    .catch(() => {
      showResult('ส่งงานไม่สำเร็จ กรุณาลองใหม่อีกครั้ง หรือแจ้งคุณครู', 'error');
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'ส่งงาน';
    });
});

function showResult(text, type) {
  resultMsg.textContent = text;
  resultMsg.className = 'msg show ' + type;
  resultMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
</script>

</html>
