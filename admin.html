<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>รายการส่งงานวิดีโอ (Admin)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1c2430;
    --text-muted: #667085;
    --border: #e2e6ec;
    --primary: #2d6cdf;
    --primary-dark: #1f52ac;
    --primary-soft: #eaf1fd;
    --danger: #d64545;
    --success: #1f9d55;
    --success-soft: #e8f8ee;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .header { margin-bottom: 18px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 21px; margin: 0 0 4px; font-weight: 700; }
  .header p { margin: 0; color: var(--text-muted); font-size: 13.5px; }
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .toolbar input[type=text] {
    flex: 1; min-width: 200px;
    padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px; outline: none;
  }
  .toolbar input[type=text]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  select.room-filter {
    padding: 10px 13px; border: 1px solid var(--border); border-radius: 10px;
    font-family: inherit; font-size: 14px; background: #fff;
  }
  .btn {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer; color: var(--text); white-space: nowrap;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary-dark); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden; box-shadow: 0 1px 2px rgba(16,24,40,0.04);
  }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  thead th {
    text-align: left; padding: 12px 14px; background: #f8f9fb;
    border-bottom: 1px solid var(--border); font-weight: 700; color: var(--text-muted);
    white-space: nowrap;
  }
  tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafbfc; }
  td.link a { color: var(--primary); text-decoration: none; }
  td.link a:hover { text-decoration: underline; }
  .state {
    padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px;
  }
  .state.error { color: var(--danger); }
  .count-badge {
    font-size: 12.5px; font-weight: 700; color: var(--primary-dark);
    background: var(--primary-soft); padding: 3px 10px; border-radius: 999px;
  }
  .setup-msg {
    background: #fff6e5; color: #96690a; padding: 13px 15px; border-radius: 10px;
    font-size: 13.5px; margin-bottom: 16px; display: none;
  }
  .setup-msg.show { display: block; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .no-print { display: none !important; }
    .card { border: none; box-shadow: none; }
    .header p.print-only { display: block !important; }
  }
  .print-only { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <h1>รายการส่งงานวิดีโอ <span class="count-badge" id="countBadge">0</span></h1>
      <p>โรงเรียนโซ่พิสัยพิทยาคม — สรุปคำตอบทั้งหมดที่นักเรียนส่งเข้ามา</p>
      <p class="print-only" id="printDate"></p>
    </div>
    <div class="no-print" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button class="btn" id="refreshBtn">🔄 รีเฟรช</button>
      <button class="btn" id="exportExcelBtn">📊 ดาวน์โหลด Excel</button>
      <button class="btn primary" id="exportPdfBtn">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
    </div>
  </div>

  <div class="setup-msg" id="setupMsg"></div>

  <div class="toolbar no-print">
    <input type="text" id="searchBox" placeholder="ค้นหาชื่อนักเรียน, ชื่อเรื่อง...">
    <select class="room-filter" id="roomFilter">
      <option value="">ทุกห้อง</option>
      <option value="ม.6/2">ม.6/2</option>
      <option value="ม.6/3">ม.6/3</option>
      <option value="ม.6/4">ม.6/4</option>
      <option value="ม.6/5">ม.6/5</option>
    </select>
  </div>

  <div class="card">
    <table id="dataTable" style="display:none;">
      <thead>
        <tr>
          <th>เวลาที่ส่ง</th>
          <th>ห้อง</th>
          <th>สมาชิกในกลุ่ม</th>
          <th>ชื่อเรื่อง</th>
          <th>ลิงก์วิดีโอ</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="state" id="stateBox">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<script>
// ต้องเป็น URL เดียวกับที่ตั้งไว้ใน video-submit-form.html
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxG480dJj-3eim_S3RszPKqsKW-lxcDafdC2jXNagwSZxrsOYoZjQR05zlUa7EXYh9zRQ/exec";

let allRows = [];
let filteredRows = [];

const tableEl = document.getElementById('dataTable');
const tbody = document.getElementById('tableBody');
const stateBox = document.getElementById('stateBox');
const countBadge = document.getElementById('countBadge');
const setupMsg = document.getElementById('setupMsg');
const searchBox = document.getElementById('searchBox');
const roomFilter = document.getElementById('roomFilter');

document.getElementById('printDate').textContent = 'พิมพ์เมื่อ ' + new Date().toLocaleString('th-TH');

if (!SCRIPT_URL || SCRIPT_URL.indexOf('PASTE_YOUR') === 0) {
  setupMsg.textContent = 'ยังไม่ได้ตั้งค่า SCRIPT_URL — กรุณาใส่ลิงก์ Apps Script Web App เดียวกับที่ใช้ในฟอร์มส่งงาน';
  setupMsg.classList.add('show');
  stateBox.textContent = 'รอการตั้งค่า';
} else {
  loadData();
}

document.getElementById('refreshBtn').addEventListener('click', loadData);
document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
document.getElementById('exportPdfBtn').addEventListener('click', () => window.print());
searchBox.addEventListener('input', applyFilters);
roomFilter.addEventListener('change', applyFilters);

function loadData() {
  tableEl.style.display = 'none';
  stateBox.style.display = 'block';
  stateBox.className = 'state';
  stateBox.textContent = 'กำลังโหลดข้อมูล...';

  const cbName = 'jsonpCallback_' + Date.now();
  const script = document.createElement('script');
  let done = false;

  const timeout = setTimeout(() => {
    if (!done) {
      showError('โหลดข้อมูลไม่สำเร็จ (หมดเวลา) กรุณาตรวจสอบ SCRIPT_URL และสิทธิ์การเข้าถึง Web app');
      cleanup();
    }
  }, 10000);

  window[cbName] = function (data) {
    done = true;
    clearTimeout(timeout);
    if (data && data.status === 'success') {
      allRows = data.rows || [];
      applyFilters();
    } else {
      showError('เกิดข้อผิดพลาดจากปลายทางข้อมูล');
    }
    cleanup();
  };

  script.src = SCRIPT_URL + (SCRIPT_URL.indexOf('?') > -1 ? '&' : '?') + 'callback=' + cbName;
  script.onerror = function () {
    if (!done) {
      showError('เชื่อมต่อ SCRIPT_URL ไม่สำเร็จ กรุณาตรวจสอบลิงก์');
    }
    cleanup();
  };
  document.body.appendChild(script);

  function cleanup() {
    setTimeout(() => {
      delete window[cbName];
      script.remove();
    }, 0);
  }
}

function applyFilters() {
  const q = searchBox.value.trim().toLowerCase();
  const room = roomFilter.value;
  filteredRows = allRows.filter(r => {
    if (room && r.room !== room) return false;
    if (!q) return true;
    return (r.members || '').toLowerCase().includes(q) ||
           (r.title || '').toLowerCase().includes(q) ||
           (r.room || '').toLowerCase().includes(q);
  });
  render();
}

function render() {
  countBadge.textContent = filteredRows.length + ' รายการ';

  if (filteredRows.length === 0) {
    tableEl.style.display = 'none';
    stateBox.style.display = 'block';
    stateBox.className = 'state';
    stateBox.textContent = allRows.length === 0 ? 'ยังไม่มีการส่งงาน' : 'ไม่พบรายการที่ตรงกับการค้นหา';
    return;
  }

  stateBox.style.display = 'none';
  tableEl.style.display = 'table';
  tbody.innerHTML = filteredRows.map(r => `
    <tr>
      <td>${escapeHtml(r.time)}</td>
      <td>${escapeHtml(r.room)}</td>
      <td>${escapeHtml(r.members)}</td>
      <td>${escapeHtml(r.title)}</td>
      <td class="link"><a href="${escapeHtml(r.link)}" target="_blank" rel="noopener">เปิดลิงก์</a></td>
    </tr>
  `).join('');
}

function showError(msg) {
  tableEl.style.display = 'none';
  stateBox.style.display = 'block';
  stateBox.className = 'state error';
  stateBox.textContent = msg;
}

function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function exportExcel() {
  if (!filteredRows.length) { alert('ไม่มีข้อมูลให้ดาวน์โหลด'); return; }
  const data = filteredRows.map(r => ({
    'เวลาที่ส่ง': r.time,
    'ห้อง': r.room,
    'สมาชิกในกลุ่ม': r.members,
    'ชื่อเรื่อง': r.title,
    'ลิงก์วิดีโอ': r.link
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{ wch: 16 }, { wch: 8 }, { wch: 45 }, { wch: 35 }, { wch: 40 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'คำตอบ');
  const stamp = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(wb, 'video-submissions-' + stamp + '.xlsx');
}
</script>
</body>
</html>
